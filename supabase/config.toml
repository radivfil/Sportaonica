# Supabase CLI config (local stack + reference for the hosted project's Auth settings).
# Hosted projects: set the same values in Dashboard → Authentication (see README).
project_id = "sportaonica"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# never auto-seed: demo data is loaded explicitly with `npm run supabase:seed -- --yes`
enabled = false

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# short-lived access tokens; the app additionally ends admin sessions 8 h after the 2FA step
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# only the owner has an account — no public sign-ups
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 10
token_verifications = 10

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
